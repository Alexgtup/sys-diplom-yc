- name: zabbix server (docker compose)
  hosts: zabbix
  become: true

  vars:
    zabbix_db_password: "{{ lookup('env', 'ZABBIX_DB_PASSWORD') | default('', true) }}"

  pre_tasks:
    - name: require ZABBIX_DB_PASSWORD
      ansible.builtin.assert:
        that:
          - zabbix_db_password | length >= 16
        fail_msg: >-
          Set a strong ZABBIX_DB_PASSWORD in the environment before running
          this playbook. Do not store the password in Git.

  tasks:
    - name: apt update
      ansible.builtin.apt:
        update_cache: true

    - name: install docker + curl
      ansible.builtin.apt:
        name:
          - docker.io
          - curl
        state: present

    - name: enable docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: install docker compose v2 binary
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: check docker compose
      ansible.builtin.command: /usr/local/bin/docker-compose version
      changed_when: false

    - name: create dir
      ansible.builtin.file:
        path: /opt/zabbix
        state: directory
        mode: "0755"

    - name: put docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/zabbix/docker-compose.yml
        mode: "0600"
        content: |
          services:
            postgres:
              image: postgres:15-alpine
              restart: unless-stopped
              environment:
                POSTGRES_USER: zabbix
                POSTGRES_PASSWORD: {{ zabbix_db_password | to_json }}
                POSTGRES_DB: zabbix
              volumes:
                - pgdata:/var/lib/postgresql/data

            zabbix-server:
              image: zabbix/zabbix-server-pgsql:6.0-ubuntu-latest
              restart: unless-stopped
              depends_on:
                - postgres
              environment:
                DB_SERVER_HOST: postgres
                POSTGRES_USER: zabbix
                POSTGRES_PASSWORD: {{ zabbix_db_password | to_json }}
                POSTGRES_DB: zabbix
              ports:
                - "10051:10051"

            zabbix-web:
              image: zabbix/zabbix-web-nginx-pgsql:6.0-ubuntu-latest
              restart: unless-stopped
              depends_on:
                - postgres
                - zabbix-server
              environment:
                DB_SERVER_HOST: postgres
                POSTGRES_USER: zabbix
                POSTGRES_PASSWORD: {{ zabbix_db_password | to_json }}
                POSTGRES_DB: zabbix
                ZBX_SERVER_HOST: zabbix-server
                PHP_TZ: UTC
              ports:
                - "80:8080"

          volumes:
            pgdata: {}

    - name: down (cleanup old state)
      ansible.builtin.command: /usr/local/bin/docker-compose down
      args:
        chdir: /opt/zabbix
      failed_when: false

    - name: pull images
      ansible.builtin.command: /usr/local/bin/docker-compose pull
      args:
        chdir: /opt/zabbix

    - name: up
      ansible.builtin.command: /usr/local/bin/docker-compose up -d
      args:
        chdir: /opt/zabbix
