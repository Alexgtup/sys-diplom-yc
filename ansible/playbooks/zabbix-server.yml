- name: zabbix server (docker compose)
  hosts: zabbix
  become: true

  tasks:
    - name: apt update
      apt:
        update_cache: true

    - name: install docker + curl
      apt:
        name:
          - docker.io
          - curl
        state: present

    - name: enable docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: install docker compose v2 binary
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: check docker compose
      command: /usr/local/bin/docker-compose version
      changed_when: false

    - name: create dir
      file:
        path: /opt/zabbix
        state: directory
        mode: "0755"

    - name: put docker-compose.yml
      copy:
        dest: /opt/zabbix/docker-compose.yml
        mode: "0644"
        content: |
          services:
            postgres:
              image: postgres:15-alpine
              restart: unless-stopped
              environment:
                POSTGRES_USER: zabbix
                POSTGRES_PASSWORD: zabbix
                POSTGRES_DB: zabbix
              volumes:
                - pgdata:/var/lib/postgresql/data

            zabbix-server:
              image: zabbix/zabbix-server-pgsql:6.0-ubuntu-latest
              restart: unless-stopped
              depends_on:
                - postgres
              environment:
                DB_SERVER_HOST: postgres
                POSTGRES_USER: zabbix
                POSTGRES_PASSWORD: zabbix
                POSTGRES_DB: zabbix
              ports:
                - "10051:10051"

            zabbix-web:
              image: zabbix/zabbix-web-nginx-pgsql:6.0-ubuntu-latest
              restart: unless-stopped
              depends_on:
                - postgres
                - zabbix-server
              environment:
                DB_SERVER_HOST: postgres
                POSTGRES_USER: zabbix
                POSTGRES_PASSWORD: zabbix
                POSTGRES_DB: zabbix
                ZBX_SERVER_HOST: zabbix-server
                PHP_TZ: UTC
              ports:
                - "80:8080"

          volumes:
            pgdata: {}

    - name: down (cleanup old state)
      command: /usr/local/bin/docker-compose down
      args:
        chdir: /opt/zabbix
      failed_when: false

    - name: pull images
      command: /usr/local/bin/docker-compose pull
      args:
        chdir: /opt/zabbix

    - name: up
      command: /usr/local/bin/docker-compose up -d
      args:
        chdir: /opt/zabbix
